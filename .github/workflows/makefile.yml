name: Makefile CI

on:
  push:
    branches: [ "liberatedsystems-master" ]

  workflow_dispatch:
    inputs:
      verbose_make:
        description: 'Verbose Makefile output'
        type: boolean
        default: false

jobs:
  build:
    strategy:
      matrix:
        config:
        - {platform: heltec32_v3, arch: esp32, build_output_dir: build/esp32.esp32.heltec_wifi_lora_32_V3}
        - {platform: rak4631, arch: nrf, build_output_dir: build/rakwireless.nrf52.WisCoreRAK4631Board}

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v2

    - name: Cache Arduino ${{ matrix.config.arch }} Cores, Libs & Index
      uses: actions/cache@v6
      with:
        path: |
          ~/.arduino15/*
          ~/.arduino15/packages
          ~/Arduino/libraries
        key: ${{ runner.os }}-arduino-${{ matrix.config.arch }}-${{ hashFiles('Makefile') }}
        restore-keys: |
          ${{ runner.os }}-arduino-${{ matrix.config.arch }}-

    - name: Update Arduino Core Index
      run: make prep-index
      # issue: https://github.com/liberatedsystems/RNode_Firmware_CE/issues/125
      continue-on-error: true

    - name: Install dependencies (Cores, Libs, Tools)
      run: make prep-${{ matrix.config.arch }}

    - name: Determine Sketch name
      run: |
        echo SKETCH_NAME=$(basename $GITHUB_WORKSPACE) | tee --append $GITHUB_ENV

    - name: Rename INO-file workaround
      # when working with Git Worktrees or GitHub fork-networks
      if: ${{ hashFiles( env.SKETCH_NAME + '.ino' ) == '' }}
      run: mv RNode_Firmware_CE.ino ${{ env.SKETCH_NAME }}.ino

    - name: Compile ${{ matrix.config.platform }}
      run: make firmware-${{ matrix.config.platform }} ${{ github.event.inputs.verbose_make == 'false' && 'V=0' || 'V=1' }}

    - name: Archive ${{ matrix.config.platform }} artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.config.platform }}
        path: |
          ${{ matrix.config.build_output_dir }}/*
        retention-days: 7
        if-no-files-found: error



