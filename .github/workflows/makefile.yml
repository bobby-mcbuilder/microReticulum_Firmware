name: Makefile CI

on:
  push:
    branches: [ "liberatedsystems-master" ]

  workflow_dispatch:
    inputs:
      verbose_make:
        description: 'Verbose Makefile output'
        type: boolean
        default: false

jobs:
  build:
    strategy:
      matrix:
        config:
        - {platform: heltec32_v3, arch: esp32}
        - {platform: rak4631, arch: nrf}

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v2

    - name: Cache Arduino Cores
      uses: actions/cache@v6
      with:
        path: ~/.arduino15
        key: ${{ runner.os }}-arduino15-${{ matrix.config.arch }}-${{ hashFiles('**/platform.local.txt') }}
        restore-keys: |
          ${{ runner.os }}-arduino15-

    - name: Update Arduino Core Index
      run: make prep-index
      # issue: https://github.com/liberatedsystems/RNode_Firmware_CE/issues/125
      continue-on-error: true

    - name: Install ${{ matrix.config.arch }} dependencies
      run: make prep-${{ matrix.config.arch }}

    - name: Determine Sketch name
      run: |
        echo Sketch name $(basename $GITHUB_WORKSPACE)
        echo SKETCH_NAME=$(basename $GITHUB_WORKSPACE) >> $GITHUB_ENV

    - name: Rename INO workaround
      run: mv RNode_Firmware_CE.ino ${{ env.SKETCH_NAME }}.ino

    - name: Compile ${{ matrix.config.platform }}
      run: make firmware-${{ matrix.config.platform }} ${{ github.event.inputs.verbose_make == 'false' && 'V=0' || 'V=1' }}

    - name: Archive rak4631 artifacts
      if: ${{ matrix.config.platform == 'rak4631'}}
      uses: actions/upload-artifact@v4
      with:
        name: rak4631
        path: |
          build/rakwireless.nrf52.WisCoreRAK4631Board/microReticulum_Firmware.ino.zip
        retention-days: 7

    - name: Archive heltec32_v3 artifacts
      if: ${{ matrix.config.platform == 'heltec32_v3'}}
      uses: actions/upload-artifact@v4
      with:
        name: heltec32_v3
        path: |
          build/esp32.esp32.heltec_wifi_lora_32_V3/microReticulum_Firmware.ino.bin
          build/esp32.esp32.heltec_wifi_lora_32_V3/microReticulum_Firmware.ino.bootloader.bin
          build/esp32.esp32.heltec_wifi_lora_32_V3/microReticulum_Firmware.ino.partitions.bin
        retention-days: 7


